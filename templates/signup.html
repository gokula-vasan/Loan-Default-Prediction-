<!DOCTYPE html>
<html>
<head>
    <title>Loan Default Predictor - Sign Up</title>
    <style>
        body { font-family: Arial; max-width: 400px; margin: 100px auto; padding: 20px; background: #f4f4f4; }
        form { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        input, button { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; }
        button { background: #FF9800; color: white; border: none; cursor: pointer; }
        .error { color: red; padding: 10px; background: #f8d7da; border-radius: 5px; margin: 10px 0; }
        .success { color: green; padding: 10px; background: #d4edda; border-radius: 5px; margin: 10px 0; }
        a { color: #2196F3; }
    </style>
</head>
<body>
    <h2>Sign Up - Loan Predictor</h2>
    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}
    {% if success %}
        <div class="success">{{ success }} <a href="/">Login here</a></div>
    {% endif %}
    <form method="POST" action="/signup">
        Username: <input type="text" name="username" required minlength="3"><br>
        Password: <input type="password" name="password" required minlength="4"><br>
        <button type="submit">Sign Up</button>
    </form>
    <p><a href="/">← Back to Login</a></p>
</body>
</html>
